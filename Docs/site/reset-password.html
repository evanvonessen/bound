<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://qevnxhngdtlyihhmvnjv.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
  <title>Reset your Bound password</title>
  <link rel="stylesheet" href="password-reset.css">
  <script type="module" src="password-reset.js"></script>
</head>
<body>
<main>
  <p>Bound account</p>
  <h1>Reset your password</h1>
  <p id="reset-status" role="status" aria-live="polite">Checking your reset link…</p>
  <p id="reset-email" class="account-email" hidden></p>
  <form id="reset-form" hidden>
    <label for="new-password">New password</label>
    <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required disabled>
    <label for="confirm-password">Confirm new password</label>
    <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required disabled>
    <p class="hint">Use at least 8 characters. Your account may require a stronger password.</p>
    <button id="reset-submit" type="submit" disabled>Save new password</button>
  </form>
  <noscript><p>Enable JavaScript to reset your password, then open the email link again.</p></noscript>
  <p class="return-instructions">After resetting your password, return to Bound and sign in with your email and new password.</p>
  <p><a href="support.html" rel="noreferrer">Bound support</a></p>
</main>
</body>
</html>
